<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Альянс Термо</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="АТ">
<style>
  :root {
    --black: #111111;
    --white: #ffffff;
    --red: #E31E24;
    --green: #1FA24A;
    --gray-bg: #F4F4F4;
    --gray-border: #E0E0E0;
    --gray-text: #8A8A8A;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--white);
    color: var(--black);
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    overflow: hidden;
    touch-action: manipulation;
  }

  #app {
    position: relative;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    max-width: 480px;
    margin: 0 auto;
    background: var(--white);
  }

  /* ===== Top-level screens (login / code / role apps) ===== */
  .top-screen {
    display: none;
    flex-direction: column;
    height: 100%;
    min-height: 0;
  }
  .top-screen.active { display: flex; }

  /* ===== Header (shared style) ===== */
  header {
    padding: 6px 16px 5px;
    border-bottom: 2px solid var(--black);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .brand { font-weight: 800; font-size: 13px; letter-spacing: 0.5px; }
  .brand span { color: var(--red); }
  .header-title { font-size: 13px; font-weight: 800; text-align: center; flex: 1; }
  .back-btn {
    border: none; background: none; color: var(--black);
    font-size: 20px; font-weight: 800; padding: 2px 6px 2px 0; line-height: 1;
  }
  .header-spacer { width: 28px; flex-shrink: 0; }

  /* ===== Screen: Login (role select) ===== */
  #screenLogin { justify-content: center; padding: 24px; gap: 14px; }
  .login-logo { text-align: center; margin-bottom: 18px; }
  .login-logo .big-a { color: var(--red); }
  .login-logo .big-t { color: var(--black); }
  .login-logo-letters {
    font-size: 64px;
    font-weight: 900;
    letter-spacing: -2px;
    line-height: 1;
  }
  .login-logo-sub {
    margin-top: 6px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--gray-text);
    text-transform: uppercase;
  }

  .role-btn {
    width: 100%;
    padding: 22px;
    border: 2px solid var(--black);
    border-radius: 16px;
    background: var(--white);
    color: var(--black);
    font-size: 18px;
    font-weight: 800;
    letter-spacing: 0.3px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .role-btn:active { background: var(--gray-bg); }
  .role-btn .arrow { color: var(--red); font-size: 20px; font-weight: 900; }

  /* ===== Screen: Code entry ===== */
  #screenCode { padding: 10px 24px 24px; justify-content: center; gap: 22px; }
  .code-role-label {
    text-align: center;
    font-size: 13px;
    font-weight: 700;
    color: var(--gray-text);
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .code-dots {
    display: flex;
    justify-content: center;
    gap: 16px;
  }
  .code-dots.shake { animation: shake 0.35s; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-10px); }
    40% { transform: translateX(9px); }
    60% { transform: translateX(-6px); }
    80% { transform: translateX(4px); }
  }
  .code-dot {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: 2px solid var(--gray-border);
    background: var(--white);
    transition: background 0.15s, border-color 0.15s, transform 0.15s;
  }
  .code-dot.filled { background: var(--red); border-color: var(--red); transform: scale(1.05); }

  .keypad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-auto-rows: min-content;
    gap: 8px;
    width: 100%;
  }
  .key {
    border: 2px solid var(--gray-border);
    border-radius: 12px;
    background: var(--gray-bg);
    font-size: 20px;
    font-weight: 700;
    color: var(--black);
    padding: 18px 0;
    width: 100%;
  }
  .key.clear { color: var(--red); }
  .key:active { background: var(--gray-border); }
  .key.ghost { visibility: hidden; }

  /* ===== Generic swipe engine ===== */
  .swipe-viewport {
    flex: 1;
    min-height: 0;
    overflow: hidden;
    position: relative;
  }
  .swipe-track {
    display: flex;
    height: 100%;
    transition: transform 0.28s cubic-bezier(0.22, 0.61, 0.36, 1);
    will-change: transform;
  }
  .swipe-screen {
    flex: 0 0 100%;
    height: 100%;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }

  .dots-indicator {
    display: flex;
    justify-content: center;
    gap: 6px;
    padding: 6px 0 4px;
    flex-shrink: 0;
  }
  .dots-indicator .idot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--gray-border);
    transition: background 0.2s, transform 0.2s;
  }
  .dots-indicator .idot.active { background: var(--red); transform: scale(1.3); }

  /* ===== Placeholder / exit content ===== */
  .placeholder-content {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 10px;
    color: var(--gray-text);
    font-size: 14px;
    font-weight: 600;
    padding: 24px;
    text-align: center;
  }

  .exit-screen {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .exit-btn {
    padding: 20px 40px;
    border: 2px solid var(--red);
    border-radius: 16px;
    background: var(--white);
    color: var(--red);
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 0.3px;
  }
  .exit-btn:active { background: var(--gray-bg); }

  /* ===== SKLAD: add/grid screen ===== */
  .skl-add-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 6px 10px 8px; gap: 5px; }
  .skl-grid-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .skl-table {
    width: 100%; height: 100%;
    border-collapse: collapse;
    border: 2px solid var(--red);
    border-radius: 6px;
    overflow: hidden;
    font-size: 17px;
    table-layout: fixed;
  }
  .skl-table thead th {
    background: var(--black); color: var(--white);
    padding: 6px 1px; font-size: 13px; font-weight: 700; text-align: center;
    border-right: 1px solid rgba(255,255,255,0.25);
  }
  .skl-table thead th:last-child { border-right: none; }
  .skl-table tbody th {
    background: var(--gray-bg); color: var(--black);
    padding: 6px 3px; font-size: 13px; font-weight: 800; text-align: left;
    border-right: 1px solid var(--gray-border); border-bottom: 1px solid var(--gray-border);
  }
  .skl-table tbody td {
    padding: 2px; text-align: center;
    border-bottom: 1px solid var(--gray-border); border-right: 1px solid var(--gray-border);
    color: var(--black); font-weight: 700;
  }
  .skl-table tbody td:last-child { border-right: none; }
  .skl-table tbody td.selected { background: var(--red); color: var(--white); font-weight: 800; }

  .key.add-key { background: var(--green); color: var(--white); border-color: var(--green); font-size: 22px; }
  .key.add-key:disabled { background: var(--gray-border); color: var(--gray-text); border-color: var(--gray-border); }

  .skl-btn-row { display: flex; gap: 8px; flex-shrink: 0; }
  .skl-action-btn {
    flex: 1; padding: 10px; border-radius: 12px; background: var(--white);
    color: var(--red); border: 2px solid var(--red); font-size: 12px; font-weight: 800; letter-spacing: 0.3px;
  }
  .skl-action-btn:disabled { border-color: var(--gray-border); color: var(--gray-border); }

  /* ===== SKLAD: report screen ===== */
  .skl-report-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 4px; overflow: hidden; padding: 6px 10px 6px; }
  .skl-report-block { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .skl-report-block-label { font-size: 9px; font-weight: 800; color: var(--red); margin: 0 0 1px 2px; flex-shrink: 0; }
  .skl-report-table { width: 100%; flex: 1; min-height: 0; border-collapse: collapse; border: 1.5px solid var(--red); border-radius: 4px; overflow: hidden; font-size: 13px; table-layout: fixed; }
  .skl-report-table th {
    background: var(--black); color: var(--white); padding: 1px; font-size: 10px; font-weight: 700; text-align: center;
    border-right: 1px solid rgba(255,255,255,0.2);
  }
  .skl-report-table th:last-child { border-right: none; }
  .skl-report-table tbody th {
    background: var(--gray-bg); color: var(--black); text-align: left; padding: 1px 2px;
    border-right: 1px solid var(--gray-border); border-bottom: 1px solid var(--gray-border);
  }
  .skl-report-table td {
    text-align: center; color: var(--black); font-weight: 700;
    border-bottom: 1px solid var(--gray-border); border-right: 1px solid var(--gray-border);
  }
  .skl-report-table td:last-child { border-right: none; }

  .loading-note { text-align: center; color: var(--gray-text); font-size: 12px; padding: 20px 0; }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--black);
    color: var(--white);
    padding: 10px 18px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    opacity: 0;
    transition: all 0.25s ease;
    pointer-events: none;
    z-index: 20;
    max-width: 85%;
    text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div id="app">

  <!-- ===================== LOGIN SCREEN ===================== -->
  <div class="top-screen active" id="screenLogin">
    <div class="login-logo">
      <div class="login-logo-letters"><span class="big-a">А</span><span class="big-t">Т</span></div>
      <div class="login-logo-sub">Альянс Термо</div>
    </div>
    <button class="role-btn" data-role="admin">Администратор <span class="arrow">›</span></button>
    <button class="role-btn" data-role="sklad">Склад <span class="arrow">›</span></button>
    <button class="role-btn" data-role="tsekh">Цех <span class="arrow">›</span></button>
  </div>

  <!-- ===================== CODE ENTRY SCREEN ===================== -->
  <div class="top-screen" id="screenCode">
    <header>
      <button class="back-btn" id="codeBackBtn">‹</button>
      <div class="header-title" id="codeRoleTitle">Код доступа</div>
      <div class="header-spacer"></div>
    </header>
    <div style="flex:1; min-height:0; display:flex; flex-direction:column; justify-content:center; gap:22px; padding: 10px 24px 24px;">
      <div class="code-role-label">Введите 4-значный код</div>
      <div class="code-dots" id="codeDots">
        <div class="code-dot"></div>
        <div class="code-dot"></div>
        <div class="code-dot"></div>
        <div class="code-dot"></div>
      </div>
      <div class="keypad" id="codeKeypad"></div>
    </div>
  </div>

  <!-- ===================== SKLAD APP ===================== -->
  <div class="top-screen" id="appSklad">
    <header>
      <div class="brand">А<span>Т</span></div>
      <div class="header-title" id="sklHeaderTitle">Склад</div>
      <div class="date-pill" style="font-size:10px;font-weight:700;color:var(--red);border:2px solid var(--red);border-radius:20px;padding:1px 8px;">—</div>
    </header>
    <div class="swipe-viewport" id="skladViewport">
      <div class="swipe-track" id="skladTrack">

        <!-- Screen 0: Добавить (grid + keypad, vertical swipe cycles tables) -->
        <div class="swipe-screen">
          <div class="skl-add-wrap">
            <div class="skl-grid-wrap" id="sklGridWrap"><div class="loading-note">Загрузка...</div></div>
            <div class="field-display" id="sklValDisplay">0</div>
            <div class="keypad" id="sklKeypad"></div>
            <div class="skl-btn-row">
              <button class="skl-action-btn" id="sklClearAllBtn">ОЧИСТИТЬ ВСЕ</button>
              <button class="skl-action-btn" id="sklDeleteBtn" disabled>УДАЛИТЬ</button>
            </div>
          </div>
        </div>

        <!-- Screen 1: Отчёт (all 4 tables) -->
        <div class="swipe-screen">
          <div class="skl-report-wrap" id="sklReportWrap"><div class="loading-note">Загрузка...</div></div>
        </div>

        <!-- Screen 2: Выход -->
        <div class="swipe-screen">
          <div class="exit-screen"><button class="exit-btn" data-exit="sklad">Выйти</button></div>
        </div>

      </div>
    </div>
  </div>

  <!-- ===================== TSEKH APP ===================== -->
  <div class="top-screen" id="appTsekh">
    <header>
      <div class="brand">А<span>Т</span></div>
      <div class="header-title">Цех</div>
      <div class="date-pill" style="font-size:10px;font-weight:700;color:var(--red);border:2px solid var(--red);border-radius:20px;padding:1px 8px;">—</div>
    </header>
    <div class="swipe-viewport" id="tsekhViewport">
      <div class="swipe-track" id="tsekhTrack" style="width: 200%;">
        <div class="swipe-screen">
          <div class="placeholder-content">Интерфейс «Цех» появится на следующем шаге</div>
        </div>
        <div class="swipe-screen">
          <div class="exit-screen"><button class="exit-btn" data-exit="tsekh">Выйти</button></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ===================== ADMIN APP ===================== -->
  <div class="top-screen" id="appAdmin">
    <header>
      <div class="brand">А<span>Т</span></div>
      <div class="header-title" id="adminScreenTitle">Отчёт · Цех</div>
      <div class="header-spacer"></div>
    </header>
    <div class="swipe-viewport" id="adminViewport">
      <div class="swipe-track" id="adminTrack" style="width: 500%;">
        <div class="swipe-screen"><div class="placeholder-content">Отчёт «Цех» появится позже</div></div>
        <div class="swipe-screen"><div class="placeholder-content">Отчёт «Склад» появится позже</div></div>
        <div class="swipe-screen"><div class="placeholder-content">Редактирование «Цех» появится позже</div></div>
        <div class="swipe-screen"><div class="placeholder-content">Редактирование «Склад» появится позже</div></div>
        <div class="swipe-screen"><div class="exit-screen"><button class="exit-btn" data-exit="admin">Выйти</button></div></div>
      </div>
    </div>
    <div class="dots-indicator" id="adminDots">
      <div class="idot active"></div><div class="idot"></div><div class="idot"></div><div class="idot"></div><div class="idot"></div>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
  // ==================== ACCESS CODES (placeholders — заменить перед выдачей сотрудникам) ====================
  const ACCESS_CODES = {
    admin: "1111",
    sklad: "2222",
    tsekh: "3333"
  };
  const ROLE_TITLES = { admin: "Администратор", sklad: "Склад", tsekh: "Цех" };
  const ADMIN_SCREEN_TITLES = ["Отчёт · Цех", "Отчёт · Склад", "Редактирование · Цех", "Редактирование · Склад", "Выход"];

  const STORAGE_KEY = "at_role";

  // ==================== GENERIC SMOOTH SWIPER ====================
  // Handles live-follow drag + fast, smooth snap between N horizontal screens.
  function createSwiper(viewportEl, trackEl, count, opts = {}) {
    let index = opts.startIndex || 0;
    const dotsEl = opts.dotsEl;
    const stepPercent = 100 / count;

    function applyTransform(withTransition) {
      trackEl.style.transition = withTransition ? "transform 0.28s cubic-bezier(0.22,0.61,0.36,1)" : "none";
      trackEl.style.transform = `translateX(-${index * stepPercent}%)`;
    }

    function updateDots() {
      if (!dotsEl) return;
      [...dotsEl.children].forEach((d, i) => d.classList.toggle("active", i === index));
    }

    function goTo(i, withTransition = true) {
      index = Math.max(0, Math.min(count - 1, i));
      applyTransform(withTransition);
      updateDots();
      if (opts.onChange) opts.onChange(index);
    }

    let dragging = false, startX = 0, startY = 0, deltaX = 0, axisLocked = null;

    viewportEl.addEventListener("touchstart", (e) => {
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
      dragging = true;
      deltaX = 0;
      axisLocked = null;
      trackEl.style.transition = "none";
    }, { passive: true });

    viewportEl.addEventListener("touchmove", (e) => {
      if (!dragging) return;
      const dx = e.touches[0].clientX - startX;
      const dy = e.touches[0].clientY - startY;
      if (axisLocked === null && (Math.abs(dx) > 6 || Math.abs(dy) > 6)) {
        axisLocked = Math.abs(dx) > Math.abs(dy) ? "x" : "y";
      }
      if (axisLocked !== "x") return; // let vertical gestures pass through untouched
      deltaX = dx;
      const basePercent = -index * stepPercent;
      const dragPercent = (dx / viewportEl.clientWidth) * stepPercent;
      trackEl.style.transform = `translateX(${basePercent + dragPercent}%)`;
    }, { passive: true });

    function endDrag() {
      if (!dragging) return;
      dragging = false;
      if (axisLocked === "x") {
        const threshold = viewportEl.clientWidth * 0.16;
        if (deltaX < -threshold && index < count - 1) index++;
        else if (deltaX > threshold && index > 0) index--;
      }
      applyTransform(true);
      updateDots();
      if (opts.onChange) opts.onChange(index);
    }
    viewportEl.addEventListener("touchend", endDrag, { passive: true });
    viewportEl.addEventListener("touchcancel", endDrag, { passive: true });

    applyTransform(false);
    updateDots();
    return { goTo, current: () => index };
  }

  // ==================== SWIPE TRACK SIZING ====================
  // Track must be count*100% of the viewport, and each screen exactly 1/count of the
  // track. We set `flex` (not `width`) inline because the .swipe-screen class sets
  // flex-basis via the `flex` shorthand, which otherwise wins over a plain width rule.
  function fixTrackChildWidths(trackEl, count) {
    trackEl.style.width = (count * 100) + "%";
    [...trackEl.children].forEach(ch => {
      ch.style.flex = `0 0 ${100 / count}%`;
    });
  }

  // ==================== TOAST ====================
  function showToast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(showToast._tm);
    showToast._tm = setTimeout(() => t.classList.remove("show"), 1800);
  }

  // ==================== TOP-LEVEL SCREEN SWITCH ====================
  function showTopScreen(id) {
    document.querySelectorAll(".top-screen").forEach(s => s.classList.toggle("active", s.id === id));
  }

  // ==================== SKLAD MODULE ====================
  const Sklad = (function () {
    const API_URL = "https://script.google.com/macros/s/AKfycbxyCUYYc6XiR5M5nsoqeJn0IjmKWlJVRqZGAREsVHckGy1WPiGxwg41_qRcNipOZaaUTg/exec";
    const TABLES = [
      { id: "пачки", label: "Пачки" },
      { id: "2000", label: "2000" },
      { id: "3000", label: "3000" },
      { id: "4000", label: "4000" }
    ];

    let ROWS = [], COLS = [], dataByTable = {};
    let currentTableIndex = 0;
    let selectedRow = null, selectedCol = null, valStr = "";
    let loaded = false;
    let horizIndex = 0; // 0 = Добавить, 1 = Отчёт, 2 = Выход — kept in sync by the outer swiper

    function currentTable() { return TABLES[currentTableIndex]; }

    async function loadAllData() {
      try {
        const res = await fetch(`${API_URL}?action=getAllData`);
        const data = await res.json();
        ROWS = data.rows; COLS = data.cols; dataByTable = data.tables;
        loaded = true;
        renderGrid();
        renderReport();
      } catch (err) {
        if (!loaded) {
          document.getElementById("sklGridWrap").innerHTML = '<div class="loading-note">Не удалось загрузить таблицу</div>';
          document.getElementById("sklReportWrap").innerHTML = '<div class="loading-note">Не удалось загрузить таблицу</div>';
        }
      }
    }

    function updateHeaderTitle() {
      const t = currentTable();
      document.getElementById("sklHeaderTitle").textContent =
        horizIndex === 0 ? t.label : (horizIndex === 1 ? "Отчёт" : "Выход");
    }

    function renderGrid() {
      if (!loaded) return;
      updateHeaderTitle();
      const t = currentTable();
      const values = dataByTable[t.id] || {};
      let html = '<table class="skl-table"><thead><tr><th></th>';
      COLS.forEach(c => html += `<th>${c}</th>`);
      html += '</tr></thead><tbody>';
      ROWS.forEach(r => {
        html += `<tr><th>${r.replace(" ", "<br>")}</th>`;
        COLS.forEach(c => {
          const v = (values[r] || {})[c];
          const isSel = (r === selectedRow && c === selectedCol);
          html += `<td class="${isSel ? "selected" : ""}" data-row="${r}" data-col="${c}">${v === "" || v === undefined ? "" : v}</td>`;
        });
        html += "</tr>";
      });
      html += "</tbody></table>";
      document.getElementById("sklGridWrap").innerHTML = html;
      document.querySelectorAll("#sklGridWrap .skl-table tbody td").forEach(td => {
        td.onclick = () => selectCell(td.dataset.row, td.dataset.col);
      });
    }

    function selectCell(row, col) {
      selectedRow = row; selectedCol = col; valStr = "";
      renderVal(); renderGrid(); updateBtnState();
    }

    function renderVal() {
      const el = document.getElementById("sklValDisplay");
      el.textContent = valStr === "" ? "0" : valStr;
      el.classList.toggle("filled", valStr !== "");
      el.classList.toggle("active", selectedRow !== null);
    }

    function updateBtnState() {
      const cellChosen = selectedRow !== null && selectedCol !== null;
      const addBtn = document.getElementById("sklAddBtn");
      if (addBtn) addBtn.disabled = !(cellChosen && valStr !== "");
      document.getElementById("sklDeleteBtn").disabled = !cellChosen;
    }

    function buildKeypad() {
      const keypad = document.getElementById("sklKeypad");
      keypad.innerHTML = "";
      ["1","2","3","4","5","6","7","8","9"].forEach(k => {
        const btn = document.createElement("button");
        btn.className = "key";
        btn.textContent = k;
        btn.onclick = () => handleDigit(k);
        keypad.appendChild(btn);
      });
      const addBtn = document.createElement("button");
      addBtn.className = "key add-key";
      addBtn.id = "sklAddBtn";
      addBtn.textContent = "✓";
      addBtn.disabled = true;
      addBtn.onclick = commitValue;
      keypad.appendChild(addBtn);

      const zeroBtn = document.createElement("button");
      zeroBtn.className = "key";
      zeroBtn.textContent = "0";
      zeroBtn.onclick = () => handleDigit("0");
      keypad.appendChild(zeroBtn);

      const backBtn = document.createElement("button");
      backBtn.className = "key";
      backBtn.textContent = "⌫";
      backBtn.onclick = () => {
        if (selectedRow === null) { showToast("Сначала выберите ячейку в таблице"); return; }
        valStr = valStr.slice(0, -1);
        renderVal(); updateBtnState();
      };
      keypad.appendChild(backBtn);
    }

    function handleDigit(k) {
      if (selectedRow === null) { showToast("Сначала выберите ячейку в таблице"); return; }
      if (valStr.length < 6) valStr += k;
      renderVal(); updateBtnState();
    }

    function commitValue() {
      if (selectedRow === null || valStr === "") return;
      const t = currentTable();
      const r = selectedRow, c = selectedCol, v = valStr;
      showToast(`${t.label} · ${r}, ${c}: ${v}`);
      if (!dataByTable[t.id][r]) dataByTable[t.id][r] = {};
      dataByTable[t.id][r][c] = Number(v);
      valStr = "";
      renderVal(); renderGrid(); updateBtnState();
      fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action: "setCell", table: t.id, row: r, col: c, value: v })
      }).then(res => res.json()).then(data => {
        if (!data.success) showToast("Не сохранилось на сервере — попробуйте снова");
      }).catch(() => showToast("Ошибка сети — не сохранено"));
    }

    function deleteValue() {
      if (selectedRow === null) return;
      const t = currentTable();
      const r = selectedRow, c = selectedCol;
      showToast(`Очищено: ${t.label} · ${r}, ${c}`);
      dataByTable[t.id][r][c] = "";
      valStr = "";
      renderVal(); renderGrid(); updateBtnState();
      fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action: "deleteCell", table: t.id, row: r, col: c })
      }).then(res => res.json()).then(data => {
        if (!data.success) showToast("Не удалось очистить на сервере");
      }).catch(() => showToast("Ошибка сети"));
    }

    function clearAllCurrentTable() {
      const t = currentTable();
      const ok = confirm(`Точно очистить всю таблицу «${t.label}»? Это действие нельзя отменить.`);
      if (!ok) return;
      ROWS.forEach(r => { COLS.forEach(c => { if (!dataByTable[t.id][r]) dataByTable[t.id][r] = {}; dataByTable[t.id][r][c] = ""; }); });
      selectedRow = null; selectedCol = null; valStr = "";
      renderVal(); renderGrid(); updateBtnState();
      fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action: "clearAll", table: t.id })
      }).then(res => res.json()).then(data => {
        if (data.success) showToast(`Таблица «${t.label}» очищена`);
        else showToast("Не удалось очистить на сервере");
      }).catch(() => showToast("Ошибка сети"));
    }

    function renderReport() {
      if (!loaded) return;
      const wrap = document.getElementById("sklReportWrap");
      let html = "";
      TABLES.forEach(t => {
        const values = dataByTable[t.id] || {};
        html += `<div class="skl-report-block"><div class="skl-report-block-label">${t.label}</div>`;
        html += '<table class="skl-report-table"><thead><tr><th></th>';
        COLS.forEach(c => html += `<th>${c}</th>`);
        html += '</tr></thead><tbody>';
        ROWS.forEach(r => {
          html += `<tr><th>${r}</th>`;
          COLS.forEach(c => {
            const v = (values[r] || {})[c];
            html += `<td>${v === "" || v === undefined ? "" : v}</td>`;
          });
          html += "</tr>";
        });
        html += "</tbody></table></div>";
      });
      wrap.innerHTML = html;
    }

    function setHorizIndex(i) {
      horizIndex = i;
      updateHeaderTitle();
      if (i === 0) {
        selectedRow = null; selectedCol = null; valStr = "";
        renderVal(); updateBtnState();
      }
      renderGrid();
    }

    function cycleTable(dir) {
      const next = currentTableIndex + dir;
      if (next < 0 || next >= TABLES.length) return;
      currentTableIndex = next;
      selectedRow = null; selectedCol = null; valStr = "";
      renderVal(); renderGrid(); updateBtnState();
    }

    let initialized = false;
    function init() {
      if (initialized) return;
      initialized = true;
      buildKeypad();
      document.getElementById("sklClearAllBtn").onclick = clearAllCurrentTable;
      document.getElementById("sklDeleteBtn").onclick = deleteValue;
      loadAllData();

      // Vertical swipe cycles tables — only meaningful on the "Добавить" screen (index 0).
      // Runs independently of the horizontal swiper below; both simply read the same touch events.
      const viewport = document.getElementById("skladViewport");
      let vStartX = 0, vStartY = 0;
      viewport.addEventListener("touchstart", (e) => {
        vStartX = e.touches[0].clientX; vStartY = e.touches[0].clientY;
      }, { passive: true });
      viewport.addEventListener("touchend", (e) => {
        if (horizIndex !== 0) return;
        const dx = e.changedTouches[0].clientX - vStartX;
        const dy = e.changedTouches[0].clientY - vStartY;
        if (Math.abs(dy) < 55 || Math.abs(dy) < Math.abs(dx) * 1.3) return;
        cycleTable(dy < 0 ? 1 : -1);
      }, { passive: true });
    }

    return { init, setHorizIndex };
  })();

  // ==================== ROLE SWIPERS (created once, lazily) ====================
  const swipers = {};

  function ensureSwiper(role) {
    if (swipers[role]) return swipers[role];
    if (role === "sklad") {
      fixTrackChildWidths(document.getElementById("skladTrack"), 3);
      swipers.sklad = createSwiper(
        document.getElementById("skladViewport"),
        document.getElementById("skladTrack"),
        3,
        { onChange: (i) => Sklad.setHorizIndex(i) }
      );
      Sklad.init();
    } else if (role === "tsekh") {
      fixTrackChildWidths(document.getElementById("tsekhTrack"), 2);
      swipers.tsekh = createSwiper(
        document.getElementById("tsekhViewport"),
        document.getElementById("tsekhTrack"),
        2
      );
    } else if (role === "admin") {
      fixTrackChildWidths(document.getElementById("adminTrack"), 5);
      swipers.admin = createSwiper(
        document.getElementById("adminViewport"),
        document.getElementById("adminTrack"),
        5,
        {
          dotsEl: document.getElementById("adminDots"),
          onChange: (i) => { document.getElementById("adminScreenTitle").textContent = ADMIN_SCREEN_TITLES[i]; }
        }
      );
    }
    return swipers[role];
  }

  // ==================== ENTER ROLE ====================
  function enterRole(role) {
    const screenId = role === "admin" ? "appAdmin" : role === "sklad" ? "appSklad" : "appTsekh";
    showTopScreen(screenId);
    const sw = ensureSwiper(role);
    sw.goTo(0, false); // always land on the main screen of the role, no leftover offset from last exit view
  }

  // ==================== LOGOUT ====================
  document.querySelectorAll("[data-exit]").forEach(btn => {
    btn.onclick = () => {
      const ok = confirm("Выйти из аккаунта? При следующем входе понадобится код доступа.");
      if (!ok) return;
      localStorage.removeItem(STORAGE_KEY);
      showTopScreen("screenLogin");
    };
  });

  // ==================== ROLE SELECT -> CODE ENTRY ====================
  let pendingRole = null;
  let codeStr = "";

  document.querySelectorAll(".role-btn").forEach(btn => {
    btn.onclick = () => {
      pendingRole = btn.dataset.role;
      codeStr = "";
      renderCodeDots();
      document.getElementById("codeRoleTitle").textContent = ROLE_TITLES[pendingRole];
      showTopScreen("screenCode");
    };
  });

  document.getElementById("codeBackBtn").onclick = () => {
    pendingRole = null;
    codeStr = "";
    showTopScreen("screenLogin");
  };

  function renderCodeDots() {
    const dots = document.querySelectorAll("#codeDots .code-dot");
    dots.forEach((d, i) => d.classList.toggle("filled", i < codeStr.length));
  }

  function wrongCodeShake() {
    const wrap = document.getElementById("codeDots");
    wrap.classList.remove("shake");
    void wrap.offsetWidth; // restart animation
    wrap.classList.add("shake");
    showToast("Неверный код");
  }

  function submitCodeIfReady() {
    if (codeStr.length !== 4) return;
    if (codeStr === ACCESS_CODES[pendingRole]) {
      localStorage.setItem(STORAGE_KEY, pendingRole);
      const role = pendingRole;
      pendingRole = null;
      codeStr = "";
      renderCodeDots();
      enterRole(role);
    } else {
      wrongCodeShake();
      setTimeout(() => { codeStr = ""; renderCodeDots(); }, 250);
    }
  }

  // Code keypad: 1-9, ghost, 0, backspace
  const codeKeypad = document.getElementById("codeKeypad");
  const codeKeys = ["1","2","3","4","5","6","7","8","9","","0","⌫"];
  codeKeys.forEach(k => {
    const btn = document.createElement("button");
    if (k === "") {
      btn.className = "key ghost";
      btn.disabled = true;
    } else {
      btn.className = "key" + (k === "⌫" ? " clear" : "");
      btn.textContent = k;
      btn.onclick = () => {
        if (k === "⌫") {
          codeStr = codeStr.slice(0, -1);
        } else if (codeStr.length < 4) {
          codeStr += k;
        }
        renderCodeDots();
        submitCodeIfReady();
      };
    }
    codeKeypad.appendChild(btn);
  });

  // ==================== DATE (shared) ====================
  function formatDate(d) {
    const dd = String(d.getDate()).padStart(2, "0");
    const mm = String(d.getMonth() + 1).padStart(2, "0");
    const yyyy = d.getFullYear();
    return `${dd}.${mm}.${yyyy}`;
  }
  document.querySelectorAll(".date-pill").forEach(el => el.textContent = formatDate(new Date()));

  // ==================== INIT: restore saved role, or show login ====================
  (function init() {
    const savedRole = localStorage.getItem(STORAGE_KEY);
    if (savedRole && ACCESS_CODES[savedRole]) {
      enterRole(savedRole);
    } else {
      showTopScreen("screenLogin");
    }
  })();

  // ==================== DISABLE PINCH / DOUBLE-TAP ZOOM ====================
  document.addEventListener("gesturestart", e => e.preventDefault());
  document.addEventListener("gesturechange", e => e.preventDefault());
  document.addEventListener("gestureend", e => e.preventDefault());
  let lastTouchEnd = 0;
  document.addEventListener("touchend", e => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) e.preventDefault();
    lastTouchEnd = now;
  }, { passive: false });

  // ==================== SERVICE WORKER (PWA installability) ====================
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("service-worker.js").catch(() => {});
    });
  }
</script>
</body>
</html>
